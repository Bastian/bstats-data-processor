[package]
name = "data-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
phf = { version = "0.13.1", features = ["macros"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
validator = { version = "0.20.0", features = ["derive"] }
actix-web = "4.11.0"
serde_with = "3.14.1"
regex = "1.11.2"
once_cell = "1.19.0"
redis-test = "0.12.0"
tokio = "1.39.1"
chrono = "0.4.42"
maxminddb = "0.26.0"
deadpool-redis = { version = "0.22.0", features = ["cluster"] }
# Must be the same version that deadpool-redis uses (https://github.com/bikeshedder/deadpool/blob/master/redis/Cargo.toml) 
redis = { version = "0.32.5", features = [
    "tokio-comp",
    "aio",
    "cluster",
    "cluster-async",
] }
# Must be the same version that deadpool-redis uses
deadpool = { version = "0.12.3", default-features = false, features = [
    "managed",
] }

[dev-dependencies]
testcontainers = "0.25.0"
libc = "0.2"
tokio = { version = "1", features = ["full", "test-util"] }
